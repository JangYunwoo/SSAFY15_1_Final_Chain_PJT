<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wafer Insight</title>
  <style>
    body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; background: #eef3fb; color: #1f2937; }
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-panel { width: min(520px, 100%); background: white; border: 1px solid #dbe3ef; border-radius: 8px; padding: 32px; }
    code { background: #f1f5f9; border-radius: 4px; padding: 2px 5px; }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <h1>Wafer Insight API</h1>
      <p>프론트엔드는 Vue/Vite 앱으로 분리되었습니다.</p>
      <p><code>npm run dev</code>로 Vue 개발 서버를 실행한 뒤 <code>http://127.0.0.1:5173</code>에서 확인하세요.</p>
    </section>
  </main>
</body>
</html>
