{% extends 'base.html' %}
{% block title %}분석하기{% endblock %}
{% block content %}
<section class="page-head"><h1>LOT 배치 분석 시작</h1></section>
<form class="panel upload-panel" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% if form.errors %}
  <div class="alert alert-danger">{{ form.errors }}</div>
  {% endif %}
  <div class="mb-4">
    <label class="form-label">담당 LOT</label>
    {{ form.lot }}
    <div class="form-text">관리자가 배정한 LOT만 선택할 수 있습니다.</div>
  </div>
  <div class="upload-drop">
    <strong>LOT CSV 업로드</strong>
    <span>한 행당 웨이퍼 1장, wafer_map 컬럼 필수</span>
    {{ form.uploaded_file }}
  </div>
  <button class="btn btn-primary mt-4">분석 시작</button>
</form>
{% endblock %}
