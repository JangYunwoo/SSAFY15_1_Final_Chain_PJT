{% extends 'base.html' %}
{% block public_content %}
<div class="login-page">
  <form class="login-panel" method="post">
    {% csrf_token %}
    <div class="logo-dot"></div>
    <h1>Wafer Insight</h1>
    <p>웨이퍼맵 분석 & 공정 점검 우선 시스템</p>
    {{ form.as_p }}
    <button class="btn btn-primary w-100">로그인</button>
    <div class="login-links"><a href="{% url 'accounts:register' %}">회원가입</a></div>
  </form>
</div>
{% endblock %}
